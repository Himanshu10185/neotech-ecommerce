<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeonTech | Premium Store</title>
    
    <link rel="stylesheet" href="Project.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="mySidebar" class="sidebar-cart">
        <button class="close-btn" onclick="toggleCart(0)">&times;</button>
        
        <div class="cart-content">
            <h2 style="color: cyan">Neon Cart</h2>
            <ul id="cart-items-list" style="list-style:none; margin-top:20px;"></ul>
            
            <div style="margin-top:30px; border-top: 1px solid gray; padding-top:20px; text-align:center;">
                <h3 style="color: white">Total: $<span id="total-price">0</span></h3>
                <button onclick="orderNow()" class="checkout-btn">BUY NOW</button>
            </div>
        </div>
    </div>

    <div class="navbar">
        <div class="logo">NEON TECH</div>
        <div class="cart-trigger" onclick="toggleCart(350)">🛒 CART (<span id="count-nav">0</span>)</div>
    </div>

    <div class="container">
        
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterItems(event, 'all')">ALL GEAR</button>
            <button class="filter-btn" onclick="filterItems(event, 'tech')">CYBER TECH</button>
            <button class="filter-btn" onclick="filterItems(event, 'home')">LIFESTYLE</button>
        </div>

        <div class="product-grid">
            
            <div class="card tech">
                <img src="https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=500" alt="Cyber Audio X">
                <h4>Cyber Audio X</h4>
                <span class="price">$199</span>
                <button class="buy-btn" onclick="addToCart('Cyber Audio X', 199)">ADD TO CART</button>
            </div>

            <div class="card tech">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Neon Watch">
                <h4>Neon Watch</h4>
                <span class="price">$299</span>
                <button class="buy-btn" onclick="addToCart('Neon Watch', 299)">ADD TO CART</button>
            </div>

            <div class="card tech">
                <img src="https://images.unsplash.com/photo-1615663245857-ac93bb7c39e7?w=500" alt="Smart Pods">
                <h4>Smart Pods</h4>
                <span class="price">$150</span>
                <button class="buy-btn" onclick="addToCart('Smart Pods', 150)">ADD TO CART</button>
            </div>

            <div class="card tech">
                <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=500" alt="Fusion Mouse">
                <h4>Fusion Mouse</h4>
                <span class="price">$85</span>
                <button class="buy-btn" onclick="addToCart('Fusion Mouse', 85)">ADD TO CART</button>
            </div>

            <div class="card home">
                <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500" alt="Cyber Phone">
                <h4>Cyber Phone</h4>
                <span class="price">$899</span>
                <button class="buy-btn" onclick="addToCart('Cyber Phone', 899)">ADD TO CART</button>
            </div>

            <div class="card home">
                <img src="https://images.unsplash.com/photo-1485955900006-10f4d324d411?w=500" alt="Holo-Plant">
                <h4>Holo-Plant</h4>
                <span class="price">$45</span>
                <button class="buy-btn" onclick="addToCart('Holo-Plant', 45)">ADD TO CART</button>
            </div>

            <div class="card home">
                <img src="https://images.unsplash.com/photo-1586210579191-33b45e38fa2c?w=500" alt="Glow Keys">
                <h4>Glow Keys</h4>
                <span class="price">$120</span>
                <button class="buy-btn" onclick="addToCart('Glow Keys', 120)">ADD TO CART</button>
            </div>

            <div class="card home">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=500" alt="Insta-Cam v2">
                <h4>Insta-Cam v2</h4>
                <span class="price">$95</span>
                <button class="buy-btn" onclick="addToCart('Insta-Cam v2', 95)">ADD TO CART</button>
            </div>
            
        </div>
    </div>

    <script src="Project.js"></script>
</body>
</html>
